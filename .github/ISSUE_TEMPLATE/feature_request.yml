name: Feature request
description: Suggest a capability or an improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the workflow, not only the implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should Myna do? Include a concrete example if you can.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Browser tools
        - Providers and models
        - Permissions and safety
        - Side panel UI
        - Settings and presets
        - MCP
        - Scheduled tasks
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before posting
      options:
        - label: I checked the existing issues and the limitations document.
          required: true
        - label: This does not require a Myna account, backend, or telemetry.
          required: true
